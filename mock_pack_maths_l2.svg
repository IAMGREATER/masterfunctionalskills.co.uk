      <text x="325" y="45" font-family="Montserrat, Arial, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">MOCK PACK</text>
      <text x="325" y="68" font-family="'Open Sans', sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">8 Full Tests</text>
